name: crawl-lai-suat

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 17:00 giờ VN, mỗi ngày
  workflow_dispatch:
    inputs:
      banks:
        description: "Lọc bank codes (vd: VCB,ACB) — để trống = tất cả"
        required: false
        default: ""
      macro_backfill:
        description: "Backfill khoảng trống CPI/cán cân TM từ Wayback (chạy 1 lần)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Daily crawl ─────────────────────────────────────────────────────────
  crawl:
    runs-on: ubuntu-latest
    concurrency:
      group: rates-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Crawl lãi suất huy động
        run: |
          if [ -n "${{ github.event.inputs.banks }}" ]; then
            python run.py --banks "${{ github.event.inputs.banks }}"
          else
            python run.py
          fi
        env:
          PYTHONUTF8: "1"
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_PATH }}

      - name: Crawl data thị trường (liên NH, điều hành SBV, tỷ giá)
        run: python crawl_market.py
        env:
          PYTHONUTF8: "1"

      - name: Crawl lợi suất TPCP 10Y (US từ FRED + VN từ Sheet)
        run: python crawl_bond.py
        env:
          PYTHONUTF8: "1"
          SHEET_ID: ${{ secrets.SHEET_ID }}

      - name: Crawl lãi suất liên NH DAILY đủ kỳ hạn ON/1W/2W/1M/3M (Vietstock)
        run: python crawl_on.py
        env:
          PYTHONUTF8: "1"

      - name: Crawl bơm/hút ròng OMO DAILY (Vietstock)
        run: python crawl_omo.py
        env:
          PYTHONUTF8: "1"

      - name: Backfill khoảng trống CPI/cán cân TM từ Wayback (thủ công)
        if: github.event.inputs.macro_backfill == 'true'
        run: python scripts/backfill_macro_wayback.py --from 2025-03 --to 2026-12
        env:
          PYTHONUTF8: "1"
        continue-on-error: true

      - name: Crawl chỉ tiêu vĩ mô (CPI/FDI/đầu tư công… — IMF + VietnamBiz)
        run: python crawl_macro.py
        env:
          PYTHONUTF8: "1"
        continue-on-error: true

      - name: Crawl vàng thế giới nối đuôi (yfinance GC=F + VND=X)
        run: python crawl_world_gold.py
        env:
          PYTHONUTF8: "1"
        continue-on-error: true

      - name: Crawl chỉ số giá kim cương IDEX (idexonline.com)
        run: python crawl_diamond.py
        env:
          PYTHONUTF8: "1"
        continue-on-error: true

      - name: Đẩy lên Google Sheet (Thứ Tư + Thứ Bảy)
        run: |
          dow="$(date -u +%u)"
          if [ "$dow" = "3" ] || [ "$dow" = "6" ] || [ -n "${{ github.event.inputs.banks }}" ]; then
            python push_to_sheet.py
          else
            echo "Không phải Thứ Tư/Thứ Bảy — bỏ qua push weekly."
          fi
        env:
          PYTHONUTF8: "1"
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_WEB_APP_URL: ${{ secrets.SHEET_WEB_APP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}

      - name: Build dashboard tĩnh (đọc nguồn từ Sheet)
        run: python scripts/build_static.py
        env:
          PYTHONUTF8: "1"
          SHEET_ID: ${{ secrets.SHEET_ID }}

      - name: Commit data
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/ dist/
          git diff --cached --quiet || git commit -m "data: cập nhật lãi suất $(date -u +%F)"
          git pull --rebase origin master
          git push

      - name: Chuẩn bị site cho Pages (index.html)
        run: cp dist/dashboard.html dist/index.html

      - name: Cấu hình Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
